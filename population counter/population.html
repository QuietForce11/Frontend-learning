<!DOCTYPE html>
<html lang="en">
<head>
  <title>Population Counter</title>
  <!-- jQuery Library -->
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <!-- Tailwind CSS Framework -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6 font-sans">

  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md p-8">

    <h1 class="text-3xl font-bold text-center text-black-600 mb-6">POPULATION COUNTER</h1>

    <!-- FORM SECTION -->
    <h2 class="text-xl font-semibold text-gray-700 border-b-2 border-gray-400 pb-2 mb-4">Add Entry</h2>

    <div class="mb-4">
      <label class="block text-gray-600 font-semibold mb-1">Full Name</label>
      <input type="text" id="nameInput" placeholder="Enter your name"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <div class="mb-4">
      <label class="block text-gray-600 font-semibold mb-1">Gender</label>
      <select id="genderInput"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
        <option value="">-- Select Gender --</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
      </select>
    </div>

    <div class="mb-4">
      <label class="block text-gray-600 font-semibold mb-1">Time of Entry</label>
      <input type="time" id="timeInput"
        class="w-full border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
    </div>

    <div class="flex gap-2 mb-4">
      <button onclick="addEntry()"
        class="bg-blue-500 hover:bg-blue-600 text-white px-5 py-2 rounded-lg font-semibold">
        Add to Population
      </button>
      <button onclick="clearAll()"
        class="bg-red-400 hover:bg-red-500 text-white px-5 py-2 rounded-lg font-semibold">
        Clear All
      </button>
    </div>

    <!-- LIVE STATS -->
    <div class="grid grid-cols-3 gap-3 mb-6">
      <div class="bg-blue-50 text-black-600 text-center font-bold py-3 rounded-lg">
        Total<br><span id="totalCount" class="text-2xl">0</span>
      </div>
      <div class="bg-blue-50 text-blue-500 text-center font-bold py-3 rounded-lg">
        Male<br><span id="maleCount" class="text-2xl">0</span>
      </div>
      <div class="bg-pink-50 text-pink-500 text-center font-bold py-3 rounded-lg">
        Female<br><span id="femaleCount" class="text-2xl">0</span>
      </div>
    </div>

    <!-- ENTRIES LIST -->
    <h2 class="text-xl font-semibold text-gray-700 border-b-2 border-gray-400 pb-2 mb-3">Current Entries</h2>
    <div id="entriesList" class="max-h-48 overflow-y-auto border border-gray-100 rounded-lg">
      <p class="text-center text-gray-400 italic p-4">No entries yet. Add someone above.</p>
    </div>

    <button onclick="computePopulation()" id="computeBtn"
      class="mt-5 w-full bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-bold text-lg">
      Compute Full Population Report
    </button>

  </div>


  <!-- MODAL -->
  <div id="modalOverlay"
    class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
    <div class="bg-white rounded-xl p-8 w-11/12 max-w-md shadow-2xl text-center">
      <h2 class="text-2xl font-bold text-blue-600 mb-5">Population Report</h2>
      <div id="modalContent"></div>
      <button onclick="closeModal()"
        class="mt-5 bg-red-400 hover:bg-red-500 text-white px-6 py-2 rounded-lg font-semibold">
        Close
      </button>
    </div>
  </div>


  <script>

    // JS — array to store entries
    var entries = [];

    // JS — count helpers
    function getTotal() { return entries.length; }
    function getMaleCount() { return entries.filter(function(e) { return e.gender === "male"; }).length; }
    function getFemaleCount() { return entries.filter(function(e) { return e.gender === "female"; }).length; }
    function getMalePercent() { return getTotal() === 0 ? 0 : ((getMaleCount() / getTotal()) * 100).toFixed(1); }
    function getFemalePercent() { return getTotal() === 0 ? 0 : ((getFemaleCount() / getTotal()) * 100).toFixed(1); }

    // DOM — update live stats
    function updateStats() {
      document.getElementById("totalCount").textContent = getTotal();
      document.getElementById("maleCount").textContent = getMaleCount();
      document.getElementById("femaleCount").textContent = getFemaleCount();
    }

    // DOM — render entries list
    function renderEntries() {
      var list = document.getElementById("entriesList");
      if (entries.length === 0) {
        list.innerHTML = '<p class="text-center text-gray-400 italic p-4">No entries yet. Add someone above.</p>';
        return;
      }
      var html = "";
      for (var i = 0; i < entries.length; i++) {
        var genderColor = entries[i].gender === "male" ? "text-blue-500" : "text-pink-500";
        html += '<div class="flex justify-between px-4 py-3 border-b border-gray-100 text-sm">';
        html += '<span>' + (i + 1) + '. ' + entries[i].name + '</span>';
        html += '<span class="font-bold ' + genderColor + '">' + (entries[i].gender === "male" ? "Male" : "Female") + '</span>';
        html += '<span class="text-gray-400">' + entries[i].time + '</span>';
        html += '</div>';
      }
      list.innerHTML = html;
    }

    // JS — add entry
    function addEntry() {
      var name = document.getElementById("nameInput").value.trim();
      var gender = document.getElementById("genderInput").value;
      var time = document.getElementById("timeInput").value;

      if (!name || !gender || !time) {
        alert("Please fill in all fields.");
        return;
      }

      entries.push({ name: name, gender: gender, time: time });
      updateStats();
      renderEntries();

      document.getElementById("nameInput").value = "";
      document.getElementById("genderInput").value = "";
      document.getElementById("timeInput").value = "";
    }

    // JS — clear all
    function clearAll() {
      if (entries.length === 0) { alert("No entries to clear."); return; }
      if (confirm("Clear all entries?")) {
        entries = [];
        updateStats();
        renderEntries();
      }
    }

    // AJAX + jQuery — compute and show modal
    function computePopulation() {
      if (getTotal() === 0) { alert("No entries yet."); return; }

      $.ajax({
        url: "https://jsonplaceholder.typicode.com/posts/1",
        method: "GET",
        success: function() {
          var content = '';
          content += '<div class="flex justify-between py-2 border-b"><span class="text-gray-500">Total Population</span><span class="font-bold text-blue-600">' + getTotal() + '</span></div>';
          content += '<div class="flex justify-between py-2 border-b"><span class="text-gray-500">Total Male</span><span class="font-bold text-blue-500">' + getMaleCount() + '</span></div>';
          content += '<div class="flex justify-between py-2 border-b"><span class="text-gray-500">Total Female</span><span class="font-bold text-pink-500">' + getFemaleCount() + '</span></div>';
          content += '<div class="flex justify-between py-2 border-b"><span class="text-gray-500">Male %</span><span class="font-bold text-blue-500">' + getMalePercent() + '%</span></div>';
          content += '<div class="flex justify-between py-2"><span class="text-gray-500">Female %</span><span class="font-bold text-pink-500">' + getFemalePercent() + '%</span></div>';

          document.getElementById("modalContent").innerHTML = content;

          // jQuery — fade in modal
          $("#modalOverlay").removeClass("hidden").hide().fadeIn(300);
        },
        error: function() { alert("Something went wrong."); }
      });
    }
    // Close modal
    function closeModal() {
      $("#modalOverlay").fadeOut(300, function() {
        $(this).addClass("hidden");
      });
    }

    // Close when clicking outside
    $("#modalOverlay").click(function(e) {
      if ($(e.target).is("#modalOverlay")) { closeModal(); }
    });

  </script>

</body>
</html>
